<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitMindAI - Intelligent Git Assistant</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --dark: #1e1b4b;
            --light: #f5f5f5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 0;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            backdrop-filter: blur(10px);
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .messages {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
            padding: 1rem;
        }

        .message {
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 0.5rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .user-message {
            background: var(--primary);
            margin-left: 2rem;
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.1);
            margin-right: 2rem;
        }

        .input-container {
            display: flex;
            gap: 1rem;
        }

        input {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            font-size: 1rem;
        }

        button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 0.5rem;
            background: var(--primary);
            color: var(--light);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: var(--secondary);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            min-width: 150px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="logo">GitMindAI</div>
            <h2>Your Intelligent Git Assistant</h2>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message ai-message">Hello! I'm GitMindAI. How can I assist you with your Git repository today?</div>
            </div>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Ask me anything about Git..." />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="commits-count">0</div>
                <div>Commits Analyzed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="suggestions-count">0</div>
                <div>AI Suggestions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="efficiency-score">0%</div>
                <div>Efficiency Score</div>
            </div>
        </div>
    </div>

    <script>
        let commitCount = 0;
        let suggestionsCount = 0;
        let efficiencyScore = 0;

        function updateStats() {
            document.getElementById('commits-count').textContent = commitCount;
            document.getElementById('suggestions-count').textContent = suggestionsCount;
            document.getElementById('efficiency-score').textContent = efficiencyScore + '%';
        }

        function simulateProgress() {
            commitCount += Math.floor(Math.random() * 5);
            suggestionsCount += Math.floor(Math.random() * 3);
            efficiencyScore = Math.min(100, efficiencyScore + Math.floor(Math.random() * 5));
            updateStats();
        }

        function addMessage(content, isUser = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = content;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (message) {
                addMessage(message, true);
                input.value = '';
                simulateProgress();
                setTimeout(() => {
                    addMessage('I understand your query about Git. Let me analyze and provide a helpful response...');
                }, 1000);
            }
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initial animation
        setInterval(simulateProgress, 5000);
    </script>
</body>
</html>
