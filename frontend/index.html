<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitMindAI - Smart Git Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --dark: #1e1b4b;
            --light: #f5f5f5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--light);
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo svg {
            width: 2rem;
            height: 2rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat {
            flex: 1;
            text-align: center;
            padding: 1rem;
            background: var(--light);
            border-radius: 0.5rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: var(--secondary);
        }

        .terminal {
            background: var(--dark);
            color: var(--light);
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: monospace;
            margin-top: 1rem;
            height: 200px;
            overflow-y: auto;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="#" class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                </svg>
                GitMindAI
            </a>
            <button class="btn">Connect Repository</button>
        </header>

        <div class="dashboard">
            <div class="card">
                <h2>Repository Analysis</h2>
                <p>AI-powered insights into your codebase</p>
                <div class="stats">
                    <div class="stat">
                        <h3>42</h3>
                        <p>Issues</p>
                    </div>
                    <div class="stat">
                        <h3>156</h3>
                        <p>Commits</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Smart Suggestions</h2>
                <p>Receive intelligent code recommendations</p>
                <div class="terminal" id="suggestions">
                    > Analyzing repository structure...
                    > Generating recommendations...
                </div>
            </div>

            <div class="card pulse">
                <h2>Git Assistant</h2>
                <p>Ask anything about your repository</p>
                <input type="text" placeholder="Ask GitMindAI..." style="width: 100%; padding: 0.5rem; margin-top: 1rem; border: 1px solid #ddd; border-radius: 0.5rem;">
            </div>
        </div>
    </div>

    <script>
        // Simulate terminal output
        const suggestions = document.getElementById('suggestions');
        const messages = [
            'Identified potential code optimizations in src/main.py',
            'Suggested: Add input validation to improve security',
            'Found 3 similar patterns that could be refactored',
            'Ready for more analysis...'
        ];

        let i = 0;
        const interval = setInterval(() => {
            if (i < messages.length) {
                suggestions.innerHTML += '\n> ' + messages[i];
                suggestions.scrollTop = suggestions.scrollHeight;
                i++;
            } else {
                clearInterval(interval);
            }
        }, 2000);

        // Add click animation to buttons
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => this.style.transform = 'scale(1)', 100);
            });
        });
    </script>
</body>
</html>
