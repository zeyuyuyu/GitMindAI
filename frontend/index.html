<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodMirror - Track Your Emotional Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-in;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00b4d8, #90e0ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mood-input {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .mood-input:hover {
            transform: translateY(-5px);
        }

        .mood-slider {
            width: 100%;
            margin: 2rem 0;
            -webkit-appearance: none;
            height: 15px;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00);
            outline: none;
        }

        .mood-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .mood-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .mood-chart {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            height: 400px;
            position: relative;
        }

        .btn {
            background: linear-gradient(45deg, #00b4d8, #90e0ef);
            border: none;
            padding: 1rem 2rem;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,180,216,0.3);
        }

        .streak-counter {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 2rem;
            color: #90e0ef;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MoodMirror</h1>
            <p>Track your emotional journey, one day at a time</p>
        </div>

        <div class="mood-input">
            <h2>How are you feeling today?</h2>
            <input type="range" min="1" max="10" value="5" class="mood-slider" id="moodSlider">
            <div id="moodValue" style="text-align: center; margin: 1rem 0;">Neutral</div>
            <button class="btn" onclick="saveMood()">Save Mood</button>
        </div>

        <div class="mood-chart">
            <canvas id="moodChart"></canvas>
        </div>

        <div class="streak-counter">
            <h3>Current Streak: <span id="streakCount">0</span> days</h3>
            <p>Keep tracking to maintain your streak!</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const moodSlider = document.getElementById('moodSlider');
        const moodValue = document.getElementById('moodValue');
        const streakCount = document.getElementById('streakCount');
        let streak = localStorage.getItem('streak') || 0;
        streakCount.textContent = streak;

        const moodLabels = {
            1: 'Very Sad',
            2: 'Sad',
            3: 'Down',
            4: 'Slightly Down',
            5: 'Neutral',
            6: 'Slightly Happy',
            7: 'Happy',
            8: 'Very Happy',
            9: 'Excellent',
            10: 'Ecstatic'
        };

        moodSlider.addEventListener('input', () => {
            moodValue.textContent = moodLabels[moodSlider.value];
        });

        const ctx = document.getElementById('moodChart').getContext('2d');
        let moodChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Mood Over Time',
                    data: [],
                    borderColor: '#00b4d8',
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 10
                    }
                }
            }
        });

        function saveMood() {
            const mood = parseInt(moodSlider.value);
            const date = new Date().toLocaleDateString();
            
            // Update chart
            moodChart.data.labels.push(date);
            moodChart.data.datasets[0].data.push(mood);
            moodChart.update();

            // Update streak
            streak++;
            localStorage.setItem('streak', streak);
            streakCount.textContent = streak;

            // Animate the save button
            const btn = document.querySelector('.btn');
            btn.style.animation = 'pulse 0.5s';
            setTimeout(() => btn.style.animation = '', 500);
        }

        // Load previous data
        const mockDates = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
        const mockMoods = [7, 6, 8, 7, 9];
        moodChart.data.labels = mockDates;
        moodChart.data.datasets[0].data = mockMoods;
        moodChart.update();
    </script>
</body>
</html>
