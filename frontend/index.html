<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAE Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1f2c, #2d3436);
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(96, 239, 255, 0.2); }
            to { text-shadow: 0 0 20px rgba(96, 239, 255, 0.4); }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #00ff87;
            margin-bottom: 1rem;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #60efff;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00ff87, #60efff);
            width: 75%;
            animation: progress 1.5s ease-out;
        }

        @keyframes progress {
            from { width: 0; }
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            background: linear-gradient(45deg, #00ff87, #60efff);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            color: #1a1f2c;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(96, 239, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Decentralized Autonomous Ecosystem</h1>
            <p>Monitor and manage your DAE components in real-time</p>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h3>System Health</h3>
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value">98%</div>
                        <div class="stat-label">Uptime</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">45ms</div>
                        <div class="stat-label">Latency</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Node Activity</h3>
                <div id="node-chart"></div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value">156</div>
                        <div class="stat-label">Active Nodes</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">1.2K</div>
                        <div class="stat-label">Transactions</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Resource Usage</h3>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value">64%</div>
                        <div class="stat-label">CPU</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">82%</div>
                        <div class="stat-label">Memory</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">2.1TB</div>
                        <div class="stat-label">Storage</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn">Deploy Node</button>
            <button class="btn">Network Settings</button>
            <button class="btn">View Analytics</button>
        </div>
    </div>

    <script>
        // Add interactive features and real-time data updates here
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                card.style.transform = 'scale(1.02)';
                setTimeout(() => card.style.transform = '', 200);
            });
        });

        // Simulate real-time updates
        setInterval(() => {
            document.querySelectorAll('.stat-value').forEach(stat => {
                const currentValue = parseInt(stat.textContent);
                const newValue = currentValue + Math.floor(Math.random() * 5) - 2;
                stat.textContent = `${newValue}${stat.textContent.replace(/[0-9]/g, '')}`;
            });
        }, 3000);
    </script>
</body>
</html>
